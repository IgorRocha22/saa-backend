# Porta dinâmica definida pela plataforma de nuvem (Padrão 8080)
server.port=${PORT:8080}

# Prefixo da API conforme definido no plano de execução
server.servlet.context-path=/api

# Configurações do Banco de Dados usando Variáveis de Ambiente
spring.datasource.url=${DB_URL:jdbc:h2:mem:saadb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console H2 (Habilitado apenas se o driver for H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console